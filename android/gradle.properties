# SHA-256 of the release signing certificate (public, not a secret): the APK from GitHub and the
# website is signed with it, and only that APK checks for new versions (app/build.gradle.kts,
# data/update/UpdateChecker.kt). The release workflow refuses an APK signed with another key.
releaseCertSha256=5A:40:F5:04:F1:DE:1F:56:20:73:1A:EC:77:A6:55:74:B5:AC:D4:09:CA:47:8B:9D:CA:0B:3C:0B:A9:4F:C9:18
