name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  sync-guard:
    name: Core tests sync guard (TS ⇄ Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: CI=true npm run core:sync-check

  android:
    name: Android (Kotlin/Compose)
    runs-on: ubuntu-latest
    # Runs once the Gradle project exists (android/ is scaffolded).
    if: hashFiles('android/settings.gradle.kts') != ''
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test
      - run: ./gradlew lint
      - run: ./gradlew build --stacktrace
