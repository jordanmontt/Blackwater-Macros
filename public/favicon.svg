<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .plate-text { font-family: 'Arial', sans-serif; font-weight: 900; fill: #f5f5f0; text-anchor: middle; }
    </style>
  </defs>

  <!-- Plate outer rim (raised lip) -->
  <circle cx="16" cy="16" r="15.5" fill="#0f2318"/>
  <circle cx="16" cy="16" r="15" fill="#1a3a2a"/>

  <!-- Outer rim highlight -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#0f2318" stroke-width="0.5"/>

  <!-- Main plate body -->
  <circle cx="16" cy="16" r="14" fill="#1a3a2a"/>

  <!-- Inner step ring -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#0f2318" stroke-width="0.6"/>

  <!-- Raised center area -->
  <circle cx="16" cy="16" r="10.5" fill="#1d3d2d"/>

  <!-- Center Olympic hole -->
  <circle cx="16" cy="16" r="2.8" fill="#0f2318"/>
  <circle cx="16" cy="16" r="2.2" fill="#f5f5f0"/>
  <circle cx="16" cy="16" r="1.6" fill="#0f2318"/>

  <!-- 20 KG text at top -->
  <text class="plate-text" x="16" y="8" font-size="3.2">20 KG</text>

  <!-- BW text at bottom -->
  <text class="plate-text" x="16" y="27" font-size="4.5">BW</text>

  <!-- Subtle texture lines for realism -->
  <line x1="5" y1="16" x2="27" y2="16" stroke="#0f2318" stroke-width="0.2" opacity="0.3"/>
  <line x1="16" y1="5" x2="16" y2="27" stroke="#0f2318" stroke-width="0.2" opacity="0.3"/>
</svg>
